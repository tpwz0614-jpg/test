<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経費管理アプリ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);

      --food:    #f97316;
      --transit: #3b82f6;
      --fun:     #a855f7;
      --other:   #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: #fff;
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .04em; }
    header p  { font-size: .8rem; opacity: .8; margin-top: 2px; }

    /* ── Layout ── */
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    @media (max-width: 700px) { .grid-charts { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .icon { font-size: 1.1rem; }

    /* ── Summary chips ── */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 480px) { .summary-grid { grid-template-columns: 1fr 1fr; } }

    .stat-chip {
      background: var(--bg);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-chip .label { font-size: .7rem; color: var(--muted); margin-bottom: 4px; }
    .stat-chip .value { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .stat-chip .value.danger { color: var(--danger); }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.span-2 { grid-column: span 2; }
    @media (max-width: 480px) { .field.span-2 { grid-column: span 1; } }

    label { font-size: .78rem; font-weight: 600; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
    textarea { resize: vertical; min-height: 60px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; margin-top: 4px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger  { background: transparent; color: var(--danger); border: 1px solid #fecaca; padding: 5px 10px; font-size: .78rem; border-radius: 6px; }
    .btn-danger:hover { background: #fef2f2; }

    /* ── Month selector ── */
    .month-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .month-bar label { font-size: .78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .month-bar input[type=month] { flex: 1; min-width: 140px; max-width: 200px; }
    .month-bar .btn-link {
      background: none; border: none; color: var(--primary); font-size: .82rem;
      cursor: pointer; text-decoration: underline; padding: 0;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    thead tr { background: var(--bg); }
    th { padding: 10px 12px; text-align: left; font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
    tbody tr:hover { background: #f8fafc; }

    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      color: #fff;
    }
    .tag-food    { background: var(--food); }
    .tag-transit { background: var(--transit); }
    .tag-fun     { background: var(--fun); }
    .tag-other   { background: var(--other); }

    .amount-cell { font-weight: 700; font-variant-numeric: tabular-nums; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: .9rem;
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; display: block; }

    /* ── Chart container ── */
    .chart-wrap { position: relative; height: 220px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: .875rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      transition: transform .3s ease;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Delete confirm ── */
    .confirm-dialog {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .confirm-dialog.open { display: flex; }
    .confirm-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
    }
    .confirm-box p { margin-bottom: 20px; font-size: .95rem; line-height: 1.5; }
    .confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }
    .btn-cancel { background: var(--bg); color: var(--text); }
    .btn-confirm-del { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

<header>
  <h1>💰 経費管理アプリ</h1>
  <p>データはブラウザに保存されます</p>
</header>

<div class="container">

  <!-- Summary -->
  <div class="summary-grid" id="summaryGrid"></div>

  <div class="grid-2">
    <!-- Add Form -->
    <div class="card">
      <h2><span class="icon">➕</span>経費を追加</h2>
      <form id="expenseForm">
        <div class="form-grid">
          <div class="field">
            <label for="date">日付</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="amount">金額（円）</label>
            <input type="number" id="amount" placeholder="例: 1500" min="1" required>
          </div>
          <div class="field">
            <label for="category">カテゴリ</label>
            <select id="category" required>
              <option value="">選択してください</option>
              <option value="food">🍚 食費</option>
              <option value="transit">🚃 交通費</option>
              <option value="fun">🎉 娯楽</option>
              <option value="other">📦 その他</option>
            </select>
          </div>
          <div class="field">
            <label for="memo">メモ（任意）</label>
            <input type="text" id="memo" placeholder="例: ランチ代">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">記録する</button>
      </form>
    </div>

    <!-- Monthly Totals Bar Chart -->
    <div class="card">
      <h2><span class="icon">📊</span>月別支出推移</h2>
      <div class="chart-wrap">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Charts Row -->
  <div class="grid-charts">
    <div class="card">
      <h2><span class="icon">🥧</span>カテゴリ別内訳</h2>
      <div class="month-bar">
        <label>対象月：</label>
        <input type="month" id="pieMonth">
        <button class="btn-link" id="pieAllBtn">全期間</button>
      </div>
      <div class="chart-wrap">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <!-- Expense List -->
    <div class="card">
      <h2><span class="icon">📋</span>明細一覧</h2>
      <div class="month-bar">
        <label>絞り込み：</label>
        <input type="month" id="listMonth">
        <button class="btn-link" id="listAllBtn">全期間</button>
      </div>
      <div class="table-wrap">
        <table id="expenseTable">
          <thead>
            <tr>
              <th>日付</th>
              <th>金額</th>
              <th>カテゴリ</th>
              <th>メモ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none">
          <span class="emoji">📭</span>
          経費データがありません
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Delete confirm dialog -->
<div class="confirm-dialog" id="confirmDialog">
  <div class="confirm-box">
    <p>この経費を削除しますか？<br>この操作は取り消せません。</p>
    <div class="btn-row">
      <button class="btn btn-cancel" id="cancelDel">キャンセル</button>
      <button class="btn btn-confirm-del" id="confirmDel">削除する</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'expense_tracker_v1';

const CATEGORIES = {
  food:    { label: '食費',   icon: '🍚', color: '#f97316' },
  transit: { label: '交通費', icon: '🚃', color: '#3b82f6' },
  fun:     { label: '娯楽',   icon: '🎉', color: '#a855f7' },
  other:   { label: 'その他', icon: '📦', color: '#6b7280' },
};

// ── State ──────────────────────────────────────────────────────────────────
let expenses = [];
let deleteTargetId = null;
let barChartInst = null;
let pieChartInst = null;
let pieMode = 'month'; // 'month' | 'all'
let listMode = 'month'; // 'month' | 'all'

// ── Storage ────────────────────────────────────────────────────────────────
function load() {
  try { expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { expenses = []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
}

// ── Date helpers ───────────────────────────────────────────────────────────
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function currentYM() {
  return new Date().toISOString().slice(0, 7);
}
function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${y}/${m}/${d}`;
}
function formatYen(n) {
  return '¥' + Number(n).toLocaleString('ja-JP');
}

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  load();

  document.getElementById('date').value = todayISO();

  const cm = currentYM();
  document.getElementById('pieMonth').value = cm;
  document.getElementById('listMonth').value = cm;

  document.getElementById('expenseForm').addEventListener('submit', onAddExpense);
  document.getElementById('cancelDel').addEventListener('click', closeConfirm);
  document.getElementById('confirmDel').addEventListener('click', executeDelete);
  document.getElementById('confirmDialog').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeConfirm();
  });
  document.getElementById('pieMonth').addEventListener('change', () => {
    pieMode = 'month';
    renderPieChart();
  });
  document.getElementById('pieAllBtn').addEventListener('click', () => {
    pieMode = 'all';
    renderPieChart();
  });
  document.getElementById('listMonth').addEventListener('change', () => {
    listMode = 'month';
    renderTable();
  });
  document.getElementById('listAllBtn').addEventListener('click', () => {
    listMode = 'all';
    renderTable();
  });

  renderAll();
});

// ── Add ────────────────────────────────────────────────────────────────────
function onAddExpense(e) {
  e.preventDefault();
  const date     = document.getElementById('date').value;
  const amount   = parseInt(document.getElementById('amount').value, 10);
  const category = document.getElementById('category').value;
  const memo     = document.getElementById('memo').value.trim();

  if (!date || !amount || !category) return;

  expenses.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    date, amount, category, memo,
  });
  save();

  document.getElementById('amount').value = '';
  document.getElementById('memo').value   = '';
  document.getElementById('amount').focus();

  // sync list/pie month to the added entry's month
  const ym = date.slice(0, 7);
  document.getElementById('listMonth').value = ym;
  listMode = 'month';
  document.getElementById('pieMonth').value = ym;
  pieMode = 'month';

  renderAll();
  showToast('✅ 経費を追加しました');
}

// ── Delete ─────────────────────────────────────────────────────────────────
function openConfirm(id) {
  deleteTargetId = id;
  document.getElementById('confirmDialog').classList.add('open');
}
function closeConfirm() {
  deleteTargetId = null;
  document.getElementById('confirmDialog').classList.remove('open');
}
function executeDelete() {
  expenses = expenses.filter(e => e.id !== deleteTargetId);
  save();
  closeConfirm();
  renderAll();
  showToast('🗑️ 削除しました');
}

// ── Render all ─────────────────────────────────────────────────────────────
function renderAll() {
  renderSummary();
  renderBarChart();
  renderPieChart();
  renderTable();
}

// ── Summary chips ──────────────────────────────────────────────────────────
function renderSummary() {
  const cm = currentYM();
  const thisMonth = expenses.filter(e => e.date.startsWith(cm));
  const total     = expenses.reduce((s, e) => s + e.amount, 0);
  const mtotal    = thisMonth.reduce((s, e) => s + e.amount, 0);

  // Top category this month
  const catSums = {};
  thisMonth.forEach(e => { catSums[e.category] = (catSums[e.category] || 0) + e.amount; });
  const topCat = Object.entries(catSums).sort((a,b) => b[1]-a[1])[0];

  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = `
    <div class="stat-chip">
      <div class="label">今月の合計</div>
      <div class="value">${formatYen(mtotal)}</div>
    </div>
    <div class="stat-chip">
      <div class="label">今月の件数</div>
      <div class="value">${thisMonth.length} 件</div>
    </div>
    <div class="stat-chip">
      <div class="label">累計支出</div>
      <div class="value">${formatYen(total)}</div>
    </div>
  `;
}

// ── Bar Chart (last 6 months) ──────────────────────────────────────────────
function renderBarChart() {
  const months = getLast6Months();
  const totals = months.map(ym =>
    expenses.filter(e => e.date.startsWith(ym)).reduce((s, e) => s + e.amount, 0)
  );
  const labels = months.map(ym => {
    const [y, m] = ym.split('-');
    return `${y.slice(2)}年${m}月`;
  });

  const ctx = document.getElementById('barChart').getContext('2d');
  if (barChartInst) barChartInst.destroy();

  barChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '支出合計（円）',
        data: totals,
        backgroundColor: months.map((ym, i) =>
          ym === currentYM() ? '#3b82f6' : '#93c5fd'
        ),
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => '  ' + formatYen(ctx.parsed.y),
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            callback: v => v >= 10000 ? (v/10000).toFixed(0)+'万' : v.toLocaleString(),
            font: { size: 11 },
          },
          grid: { color: '#f1f5f9' },
        },
        x: { ticks: { font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

function getLast6Months() {
  const result = [];
  const d = new Date();
  for (let i = 5; i >= 0; i--) {
    const t = new Date(d.getFullYear(), d.getMonth() - i, 1);
    result.push(`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`);
  }
  return result;
}

// ── Pie Chart ─────────────────────────────────────────────────────────────
function renderPieChart() {
  const ym = document.getElementById('pieMonth').value;
  const src = pieMode === 'all'
    ? expenses
    : expenses.filter(e => e.date.startsWith(ym));

  const sums = {};
  src.forEach(e => { sums[e.category] = (sums[e.category] || 0) + e.amount; });

  const cats   = Object.keys(sums);
  const values = cats.map(c => sums[c]);
  const colors = cats.map(c => CATEGORIES[c]?.color || '#999');
  const labels = cats.map(c => CATEGORIES[c] ? `${CATEGORIES[c].icon} ${CATEGORIES[c].label}` : c);

  const ctx = document.getElementById('pieChart').getContext('2d');
  if (pieChartInst) pieChartInst.destroy();

  if (values.length === 0) {
    pieChartInst = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: ['データなし'], datasets: [{ data: [1], backgroundColor: ['#e2e8f0'] }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
        }
      }
    });
    return;
  }

  pieChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderWidth: 2,
        borderColor: '#fff',
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '58%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 12 }, padding: 12, boxWidth: 14 }
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
              const pct = ((ctx.parsed / total) * 100).toFixed(1);
              return `  ${formatYen(ctx.parsed)}  (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

// ── Table ──────────────────────────────────────────────────────────────────
function renderTable() {
  const ym = document.getElementById('listMonth').value;
  const src = listMode === 'all'
    ? expenses
    : expenses.filter(e => e.date.startsWith(ym));

  const sorted = [...src].sort((a,b) => b.date.localeCompare(a.date));

  const tbody = document.getElementById('expenseBody');
  const empty = document.getElementById('emptyState');

  if (sorted.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = sorted.map(e => {
    const cat = CATEGORIES[e.category] || { label: e.category, icon: '', color: '#999' };
    return `
      <tr>
        <td style="white-space:nowrap">${formatDate(e.date)}</td>
        <td class="amount-cell" style="white-space:nowrap">${formatYen(e.amount)}</td>
        <td><span class="tag tag-${e.category}">${cat.icon} ${cat.label}</span></td>
        <td style="color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            title="${escHtml(e.memo)}">${escHtml(e.memo) || '—'}</td>
        <td><button class="btn btn-danger" onclick="openConfirm('${e.id}')">削除</button></td>
      </tr>
    `;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
